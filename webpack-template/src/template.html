<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do APP</title>
</head>
<body>
    <aside>
        <div class="user-wrapper">
            <div class="user-icon"></div>
            <div class="user-name">3Hed</div>
        </div>
        <div class="projects-container">
            <h3>ToDay</h3>
            <div class="projects-list">
                <h3>My Projects</h3>
                <p>Personal</p>
                <p>Work</p>
                <p>Life</p>
            </div>
        </div>
    </aside>
    <header>
        <h2>All My Tasks</h2>
        <div class="sort-icon">icon</div>
    </header>
    <main>
        <div class="tasks-container">
            <div class="tasks-wrapper">
                <h3 class="project-name">ToDay</h3>
                <div class="tasks">
                    <p>Do Laundrey</p>
                    <p>Clean</p>
                    <p>Call back</p>
                </div>
                <div>
                    <button class="add-tasks-btn">Add Task</button>
                </div>
            </div>
        </div>
        <div class="tasks-editor-container">
            <div class="editor-header">
                <div class="complete-btn-wrapper">
                    <button class="complete-btn">Mark as complete</button>
                </div>
                <h1 task-editor-name>Task name</h1>
                <div class="editor-btns-wrapper">
                    <button class="reminder-btn">Remind me</button>
                    <button project-btn>Personal</button>
                    <button class="description-btn">Add description</button>
                </div>
                <div class="notes-menu">
                    <h3>NOTES</h3>
                    <button class="add-note-btn">Add note</button>
                </div>
                <div class="delete-btn-container">
                    <button class="delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
