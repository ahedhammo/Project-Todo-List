<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do APP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
    <div class="name-wrapper">
        <h3>Hello ahed,</h3>
        <p>You have work today</p>
    </div>
    <div class="projects-container">
        <div class="today project">
            <div class="icon">HH</div>
            <div class="project-text-wrapper">
                <p>today</p>
                <p>6</p>
            </div>
        </div>
        <div class="schduled project">
            <div class="icon">HH</div>
            <div class="project-text-wrapper">
                <p>schduled</p>
                <p>3</p>
            </div>
        </div>
        <div class="all project">
            <div class="icon">HH</div>
            <div class="project-text-wrapper">
                <p>All</p>
                <p>12</p>
            </div>
        </div>
        <div class="add project">
            <div class="icon">HH</div>
        </div>
    </div>
   </header>
   <main>
    <div class="tasks-container">
            <h3>Today's Tasks</h3>
            <div class="task-wrapper">
                <ul class="tasks">
                    <span class="task-checkbox uncompleted">icon</span>
                    <li tasks-name>Code for 4H</li>
                </ul>
            </div>
    </div>
    <div class="add-tasks-btn-wrapper">
        <button class="add-tasks-btn">+</button>
    </div>
   </main>
    </div>
</body>
</html>
